name: Import freely licensed catalog photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-photos.yml'
      - 'scripts/import_photos.py'
permissions:
  contents: write
concurrency:
  group: catalog-photos
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Validate importer syntax
        run: python -m py_compile scripts/import_photos.py
      - name: Import photos with bounded execution time
        run: timeout 35m python -u scripts/import_photos.py
        continue-on-error: true
      - name: Save licensed local photo bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -c 'import json; from pathlib import Path; p=Path("photo-catalog.js"); d=json.loads(p.read_text().removeprefix("const PRODUCT_PHOTOS=").strip().removesuffix(";")); print("Saved entries:", len(d)); assert all(x["src"].startswith("data:image/webp;base64,") and x["license"] and x["source"] for x in d.values())'
          git add photo-catalog.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import verified freely licensed product photos"
          git push origin HEAD:main
