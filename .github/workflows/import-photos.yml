name: Organize catalog WebP files
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-photos.yml'
      - 'scripts/import_photos.py'
      - 'scripts/replace_photos.py'
      - 'scripts/photo-replacements.json'
      - 'images/**'
permissions:
  contents: write
concurrency:
  group: catalog-photos
  cancel-in-progress: false
jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Import curated replacement candidates
        run: python scripts/replace_photos.py
      - name: Extract and verify local WebP files
        run: python scripts/import_photos.py
      - name: Generate catalog review sheets
        run: python scripts/catalog_review.py
      - name: Upload review sheets
        uses: actions/upload-artifact@v4
        with:
          name: catalog-review-sheets
          path: /tmp/catalog-review/*.jpg
      - name: Commit only after verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images photo-catalog.js photo-import-report.json photo-quality-review.json
          if ! git diff --cached --quiet; then
            git commit -m "Organize catalog photos into verified local WebP folders"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
