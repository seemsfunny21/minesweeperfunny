name: Import freely licensed catalog photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-photos.yml'
      - 'scripts/import_photos.py'
permissions:
  contents: write
concurrency:
  group: catalog-photos
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/import_photos.py
      - name: Save licensed local photo bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-catalog.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import verified freely licensed product photos"
          git push origin HEAD:main
